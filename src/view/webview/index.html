<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}};"
  />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>LangFuse Glance</title>
</head>
<body>
  <div class="summary-bar">
    <div class="summary" id="summary"></div>
    <button id="refreshBtn" title="Refresh now">↻</button>
  </div>
  <ul id="rows"></ul>
  <div class="empty" id="empty" hidden>
    <span id="emptyText">No connection configured.</span>
    <a href="#" id="configureLink">Configure LangFuse connection</a>
  </div>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
